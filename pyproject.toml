[project]
name = "rrb"
version = "0.1.0"
description = "Renewal Risk Brief — cited, tenant-isolated renewal risk briefs from synthetic SMB data"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
llm = ["anthropic>=0.40"]

[project.scripts]
rrb = "rrb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rrb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
# Vercel looks for a module-level FastAPI instance named `app`; ours is built
# in api/index.py, which points it at the committed read-only dataset.
entrypoint = "api.index:app"
